apply plugin: 'com.android.application'

// --- Release signing ---------------------------------------------------------
// Reads credentials from android/keystore.properties (gitignored — never commit it).
// If the file is absent (fresh clone / CI without secrets), release builds fall back
// to unsigned and debug builds are unaffected. See keystore.properties.template.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def hasKeystore = keystorePropertiesFile.exists()
if (hasKeystore) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.TDS.zombietowerdefense"
    compileSdk rootProject.ext.compileSdkVersion
    signingConfigs {
        release {
            if (hasKeystore) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    defaultConfig {
        applicationId "com.TDS.zombietowerdefense"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 21
        versionName "1.0.20"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }
            // R8: shrinks/obfuscates the dex; the mapping file is embedded in the AAB
            // (BUNDLE-METADATA/…/proguard.map) so Play deobfuscates crashes automatically.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Native-lib symbol tables embedded in the AAB for Play's crash symbolication.
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // Native Firebase: Crashlytics ONLY, for native crash visibility (the WebView Firebase Web
    // SDK still handles auth/Firestore/analytics/remote config). Crashlytics pulls in
    // firebase-sessions, which needs androidx.datastore 1.1+ — an older transitive datastore is
    // what crashed v1.0(1) on launch (NoClassDefFoundError androidx.datastore.DataStoreFile),
    // so the explicit 1.1.1 pins below are load-bearing. Verify after dependency changes with:
    //   ./gradlew app:dependencies --configuration releaseRuntimeClasspath | grep datastore
    implementation platform("com.google.firebase:firebase-bom:33.7.0")
    implementation "com.google.firebase:firebase-crashlytics"
    implementation "androidx.datastore:datastore:1.1.1"
    implementation "androidx.datastore:datastore-preferences:1.1.1"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// This is a pure-Java module (no Kotlin plugin), so Gradle lacks the Kotlin plugin's variant
// rules and resolves Kotlin-multiplatform libraries (androidx.datastore, needed by
// firebase-sessions) to their *jvm* variant — whose jar lacks the Android-only DataStoreFile
// class, crashing the app at startup with NoClassDefFoundError (the Play-rejection crash of
// v1.0(1)). Request the androidJvm platform type and register the same compatibility /
// disambiguation rules the Kotlin plugin would, so KMP libs resolve to -android variants while
// jvm-only KMP libs (androidx.annotation) and plain AARs/jars keep working.
// Verify after Gradle/dep changes: the release AAB dex must contain Landroidx/datastore/DataStoreFile.
class KotlinPlatformCompatRule implements AttributeCompatibilityRule<String> {
    void execute(CompatibilityCheckDetails<String> details) {
        if (details.consumerValue == "androidJvm" && details.producerValue in ["jvm", "common"]) {
            details.compatible()
        }
    }
}
class KotlinPlatformDisambiguationRule implements AttributeDisambiguationRule<String> {
    void execute(MultipleCandidatesDetails<String> details) {
        if (details.candidateValues.contains("androidJvm")) {
            details.closestMatch("androidJvm")
        } else if (details.candidateValues.contains("jvm")) {
            details.closestMatch("jvm")
        }
    }
}
def kotlinPlatformType = Attribute.of("org.jetbrains.kotlin.platform.type", String)
dependencies.attributesSchema {
    attribute(kotlinPlatformType) {
        compatibilityRules.add(KotlinPlatformCompatRule)
        disambiguationRules.add(KotlinPlatformDisambiguationRule)
    }
}
configurations.all {
    if (name.endsWith("RuntimeClasspath") || name.endsWith("CompileClasspath")) {
        attributes.attribute(kotlinPlatformType, "androidJvm")
    }
}

apply from: 'capacitor.build.gradle'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
